
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ODDS LAB | みぴか研究所</title>
<style>
body{margin:0;background:#faf4fb;color:#33243d;font-family:sans-serif}
header{background:#392344;color:white;padding:20px}
main{max-width:900px;margin:auto;padding:15px}
section{background:white;border-radius:15px;padding:18px;margin:15px 0}
select,input,button{font:inherit;padding:10px;margin:5px;border:1px solid #ccc;border-radius:8px}
button{background:#75428c;color:white;cursor:pointer}
input[type=number]{width:100px}
table{width:100%;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}
small{color:#76647c}
</style>
</head>
<body>
<header><h1>🚤 ODDS LAB</h1>みぴか研究所</header>
<main>
<section>
<h2>レース選択</h2>
<select id="venue"></select>
<select id="race"></select>
</section>
<section>
<h2>舟券種・買い目</h2>
<select id="type"></select>
<p><small>例：3連単なら 1-2-3,1-3-2,2-1-3</small></p>
<input id="bets" style="width:85%" value="1-2-3,1-3-2,2-1-3">
<p><button onclick="makeBets()">買い目を作成</button></p>
</section>
<section>
<h2>💰 自動資金分配</h2>
<label>総予算（円）
<input id="budget" type="number" value="3000" min="0" step="100">
</label>
<p>
<label>分配方法
<select id="mode">
<option value="return">均等払戻</option>
<option value="equal">均等購入額</option>
<option value="odds">高オッズ重視</option>
</select>
</label>
</p>
<div style="overflow-x:auto">
<table>
<thead><tr><th>買い目</th><th>オッズ</th><th>購入額</th><th>差引</th></tr></thead>
<tbody id="results"></tbody>
</table>
</div>
<p id="total"></p>
<button onclick="calculate()">自動分配する</button>
</section>
<section>
<h2>オッズ取得</h2>
<p>現在、実オッズ取得は未接続です。</p>
<small>30秒更新は取得元の検証後に追加予定です。</small>
</section>
<a href="./index.html">← HOMEに戻る</a>
</main>
<script>
const venues="桐生 戸田 江戸川 平和島 多摩川 浜名湖 蒲郡 常滑 津 三国 びわこ 住之江 尼崎 鳴門 丸亀 児島 宮島 徳山 下関 若松 芦屋 福岡 唐津 大村".split(" ");
const types=["3連単","3連複","2連単","2連複","拡連複","単勝","複勝"];
const $=id=>document.getElementById(id);
$("venue").innerHTML=venues.map(x=>`<option>${x}</option>`).join("");
$("venue").value="尼崎";
$("race").innerHTML=Array.from({length:12},(_,i)=>`<option>${i+1}R</option>`).join("");
$("type").innerHTML=types.map(x=>`<option>${x}</option>`).join("");
let tickets=[];
function makeBets(){
 const type=$("type").value;
 const n=type.startsWith("3")?3:(type==="単勝"||type==="複勝"?1:2);
 const ordered=type.endsWith("単");
 const raw=$("bets").value.split(/[,、\n]+/).map(x=>x.trim()).filter(Boolean);
 const next=[];
 for(const item of raw){
  const nums=item.split("-").map(Number);
  if(nums.length!==n||nums.some(x=>!Number.isInteger(x)||x<1||x>6)||new Set(nums).size!==n){
   alert("買い目の艇番や形式を確認してね");
   return;
  }
  if(!ordered)nums.sort((a,b)=>a-b);
  const key=nums.join("-");
  if(!next.includes(key))next.push(key);
 }
 tickets=next;
 $("results").innerHTML=tickets.map(x=>`
 <tr>
 <td>${x}</td>
 <td><input type="number" class="odd" min="0.01" step="0.01" placeholder="入力"></td>
 <td class="amount">0円</td>
 <td class="profit">—</td>
 </tr>`).join("");
 $("total").textContent="オッズを入力して自動分配してね";
}
function calculate(){
 const budget=Number($("budget").value);
 if(!Number.isFinite(budget)||budget<0){
  alert("予算を確認してね");return;
 }
 const units=Math.floor(budget/100);
 const rows=[...document.querySelectorAll("#results tr")];
 const valid=rows.map((row,i)=>({
  i,
  odd:Number(row.querySelector(".odd").value)
 })).filter(x=>{
  const input=rows[x.i].querySelector(".odd");
  return input.value.trim()!==""&&Number.isFinite(x.odd)&&x.odd>0;
 });
 const mode=$("mode").value;
 const amounts=rows.map(()=>0);
 if(valid.length){
  const weights=valid.map(x=>
   mode==="return"?1/x.odd:
   mode==="odds"?x.odd:1
  );
  const sum=weights.reduce((a,b)=>a+b,0);
  const raw=weights.map(w=>units*w/sum);
  const base=raw.map(Math.floor);
  let remaining=units-base.reduce((a,b)=>a+b,0);
  const order=raw.map((v,i)=>({i,part:v-base[i]}))
   .sort((a,b)=>b.part-a.part);
  for(let i=0;i<remaining;i++)base[order[i].i]++;
  valid.forEach((x,j)=>amounts[x.i]=base[j]*100);
 }
 const spent=amounts.reduce((a,b)=>a+b,0);
 rows.forEach((row,i)=>{
  const amount=amounts[i];
  const input=row.querySelector(".odd");
  const odd=Number(input.value);
  row.querySelector(".amount").textContent=amount.toLocaleString()+"円";
  row.querySelector(".profit").textContent=
   input.value.trim()!==""&&odd>0&&amount>0
   ?Math.round(amount*odd-spent).toLocaleString()+"円"
   :"—";
 });
 $("total").textContent=
  `合計投資額：${spent.toLocaleString()}円 / 予算：${budget.toLocaleString()}円`
  +(valid.length<rows.length?"（オッズ未入力あり）":"")
  +(units<valid.length?"（予算不足の買い目あり）":"");
}
$("budget").addEventListener("input",calculate);
$("mode").addEventListener("change",calculate);
$("type").addEventListener("change",()=>{
 $("bets").value=$("type").value==="3連単"
 ?"1-2-3,1-3-2,2-1-3"
 :$("type").value==="3連複"?"1-2-3"
 :["単勝","複勝"].includes($("type").value)?"1,2":"1-2";
 makeBets();
});
makeBets();
</script>
</body>
</html>
