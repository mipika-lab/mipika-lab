
name: Collect CSV Odds

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect CSV odds
        run: python scripts/collect_csv_odds.py

      - name: Commit downloaded CSV data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/csv_odds/
          if git diff --cached --quiet; then
            echo "No new CSV data to commit"
          else
            git commit -m "Update historical CSV odds"
            git push
          fi
