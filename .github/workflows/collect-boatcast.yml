name: Collect Boatcast Odds

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "開始日 YYYY-MM-DD"
        required: true
        default: "2026-10-29"
      end_date:
        description: "終了日 YYYY-MM-DD"
        required: true
        default: "2026-10-29"

  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

concurrency:
  group: boatcast-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer

      - name: Install Boatcast scraper
        run: |
          composer require boatrace/scraper-boatcast \
            --no-interaction --no-progress

      - name: Set collection dates
        id: dates
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_START: ${{ inputs.start_date }}
          INPUT_END: ${{ inputs.end_date }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            DATE=$(TZ=Asia/Tokyo date -d 'yesterday' +%F)
            echo "start=$DATE" >> "$GITHUB_OUTPUT"
            echo "end=$DATE" >> "$GITHUB_OUTPUT"
          else
            echo "start=$INPUT_START" >> "$GITHUB_OUTPUT"
            echo "end=$INPUT_END" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect odds
        run: |
          php scripts/collect_boatcast.php \
            "${{ steps.dates.outputs.start }}" \
            "${{ steps.dates.outputs.end }}"

      - name: Commit downloaded data
        if: always()
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/boatcast_odds/

          if git diff --cached --quiet; then
            echo "No new data to commit"
            exit 0
          fi

          git commit -m "Update Boatcast historical odds"

          for attempt in 1 2 3; do
            echo "Push attempt: $attempt"

            git fetch origin "$GITHUB_REF_NAME"

            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              echo "ERROR: Rebase conflict"
              exit 1
            fi

            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "SUCCESS: Odds data saved to GitHub"
              exit 0
            fi

            sleep 5
          done

          echo "ERROR: Push failed after 3 attempts"
          exit 1
