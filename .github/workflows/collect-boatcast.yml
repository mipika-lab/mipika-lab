
name: Collect Boatcast Odds

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '開始日 YYYY-MM-DD'
        required: true
        default: '2026-07-22'
      end_date:
        description: '終了日 YYYY-MM-DD'
        required: true
        default: '2026-07-22'

permissions:
  contents: write

concurrency:
  group: boatcast-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install Boatcast scraper
        run: composer require boatrace/scraper-boatcast --no-interaction --no-progress

      - name: Collect odds
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: php scripts/collect_boatcast.php "$START_DATE" "$END_DATE"

      - name: Commit downloaded data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boatcast_odds/
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "Update Boatcast historical odds"
            git push
          fi
