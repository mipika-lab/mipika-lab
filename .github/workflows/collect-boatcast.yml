
name: Collect Boatcast Odds

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install Boatcast scraper
        run: |
          composer require boatrace/scraper-boatcast --no-interaction --no-progress

      - name: Collect odds
        run: |
          php scripts/collect_boatcast.php 2026-05-18

      - name: Commit downloaded data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boatcast_odds/
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "Add Boatcast historical odds"
            git push
          fi
