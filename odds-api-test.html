<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ODDS LAB | API接続テスト</title><style>body{font-family:system-ui;background:#faf4fb;color:#38233d;max-width:850px;margin:auto;padding:20px}section{background:white;padding:20px;border-radius:15px;margin:14px 0}button,input,select{font:inherit;padding:9px;margin:5px;border-radius:8px;border:1px solid #aaa}button{background:#75428c;color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f0f8;padding:12px;border-radius:8px;max-height:420px;overflow:auto}.warn{color:#a3234d}</style></head><body><h1>🚤 ODDS LAB API接続テスト</h1><p class="warn">検証専用。取得値は舟券購入に使用しないでください。既存サイトは変更しません。</p><section><label>取得元 <select id="source"><option value="odds">BoatraceOdds（非公式・約30分間隔）</option><option value="open">Boatrace Open API（オッズなし・比較用）</option></select></label><label>日付（日本時間）<input id="date" type="date"></label><button id="go">データ取得テスト</button><p id="status" role="status">未実行</p><p id="info"></p></section><section><h2>取得データの構造</h2><pre id="out">ここに結果が表示されます。</pre></section><script>
const $=id=>document.getElementById(id);
const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('date').value=today;
function describe(value,depth=0){if(depth>3)return '[省略]';if(Array.isArray(value))return {type:'array',length:value.length,first:value.length?describe(value[0],depth+1):null};if(value&&typeof value==='object')return Object.fromEntries(Object.entries(value).slice(0,18).map(([k,v])=>[k,describe(v,depth+1)]));return value;}
$('go').onclick=async()=>{const date=$('date').value.replaceAll('-','');if(!/^\d{8}$/.test(date)){ $('status').textContent='日付を指定してね';return;}const y=date.slice(0,4);const base=$('source').value==='odds'?'https://lamrongol.github.io/BoatraceOdds/v3/':'https://boatraceopenapi.github.io/api/v1/';const url=base+y+'/'+date+'.json';$('status').textContent='取得中…';$('info').textContent='取得URL：'+url;$('out').textContent='';try{const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status+'（ファイルが存在しない可能性）');const data=await response.json();$('status').textContent='取得成功（JSON解析成功）';$('out').textContent=JSON.stringify(describe(data),null,2);if($('source').value==='odds')$('info').textContent+='\n注意：取得成功は最新オッズを意味しません。データの対象日・更新時刻・組番対応は未検証です。';else $('info').textContent+='\n注意：このAPIは当日オッズを提供していません。';}catch(e){$('status').textContent='取得失敗：'+e.message;$('out').textContent='原因候補：未公開の日付、通信障害、ブラウザのCORS制限。';}};
</script></body></html>
